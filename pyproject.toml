[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scprep"
dynamic = ["version"]
description = "scprep"
authors = [
    {name = "Scott Gigante, Daniel Burkhardt and Jay Stanley, Yale University", email = "krishnaswamylab@gmail.com"}
]
license = {text = "Yale License"}
readme = "README.rst"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "decorator>=4.3.0",
    "pandas>=2.0.0",
    "packaging",
]
keywords = [
    "big-data",
    "computational-biology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.setuptools.dynamic]
version = {attr = "scprep.version.__version__"}

[project.urls]
Homepage = "https://github.com/KrishnaswamyLab/scprep"
Repository = "https://github.com/KrishnaswamyLab/scprep"
Download = "https://github.com/KrishnaswamyLab/scprep/archive/v{version}.tar.gz"

[project.optional-dependencies]
optional = [
    "fcsparser<0.2.5",
    "tables",
    "h5py",
    "anndata",
    "anndata2ri>=1.0.6",
]
test = [
    "nose",
    "nose2",
    "coverage",
    "coveralls",
    "parameterized",
    "requests",
    "packaging",
    "mock",
    "h5py",
    "matplotlib>=3.0",
    "rpy2>=3.4.3",
    "black",
    "fcsparser<0.2.5",
    "tables",
    "h5py",
    "anndata",
    "anndata2ri>=1.0.6",
]
doc = [
    "sphinx>=2.2,<2.4",
    "sphinxcontrib-napoleon",
    "ipykernel",
    "nbsphinx",
    "autodocsumm",
]

[tool.setuptools.packages.find]